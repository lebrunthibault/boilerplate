name: Deploy to VPS

on:
  push:
    branches:
      - main

# Un seul déploiement à la fois. Deux runs en parallèle feraient chacun `compose up
# --force-recreate api`, le second supprimant le container que le premier recrée : la prod
# resterait sans API derrière un nginx neuf. cancel-in-progress: false parce qu'interrompre un
# déploiement en cours de recréation produit exactement le même état cassé : le second run attend
# la fin du premier. GitHub n'entretient qu'un seul run en attente par groupe et annule les
# précédents, donc une rafale de pushes déploie le dernier commit sans empiler la file.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

# Défaut restrictif : aucun job n'obtient une permission qu'il n'a pas demandée. Le job `test`
# relève contents:read pour checkout (dépôt privé) ; `deploy` n'utilise pas le GITHUB_TOKEN.
permissions: {}

# À configurer dans le dépôt GitHub :
#   secrets : VPS_HOST, VPS_SSH_USER, VPS_SSH_KEY
#   variables : APP_URL (ex. https://example.com), APP_DIR (ex. /opt/boilerplate)

jobs:
  test:
    name: Gate — tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # Épinglé par SHA pour la même raison que ssh-action plus bas (un tag est mobile).
        # SHA = release v7.0.1.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup uv
        # SHA = release v10.0.1. enable-cache : l'installation des paquets du lock domine la durée
        # du job, pas les tests.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Environnement de test
        # .env.example porte APP_ENV=local (pas de durcissement prod) et c'est la même source de
        # vérité que le garde-fou de parité de deploy.sh.
        run: cp .env.example .env

      - name: Tests (l'arbre poussé s'importe et répond)
        # Attrape une classe de panne invisible en local : du code commité qui référence du code
        # resté dans le worktree — `make test` teste l'arbre *sale*, qui contient le symbole
        # manquant. tests/conftest.py importe api.main : toute ImportError fait échouer la
        # collecte. Réseau bloqué (pytest-socket). Si la suite devient lente, restreindre à
        # tests/test_health.py.
        run: uv run --frozen --extra dev pytest -q

  deploy:
    name: Deploy to VPS
    # Le déploiement ne part que si le gate est vert : mieux vaut ne jamais toucher la prod que
    # la réparer après coup (le healthcheck ci-dessous, lui, échoue quand le mal est déjà fait).
    needs: test
    # Tant que la prod n'est pas configurée (variable APP_DIR absente), on s'arrête au gate :
    # un deploy sans hôte échouerait sur « missing server host » et peindrait la CI en rouge
    # alors que le code est sain. Le contexte `secrets` n'est pas lisible dans un `if` de job,
    # d'où le test sur une variable, obligatoire de toute façon pour le `cd`.
    if: vars.APP_DIR != ''
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        # Épinglé par SHA : le tag v1 est mobile, un retag malveillant de l'action
        # lui donnerait la clé SSH de prod. SHA = release v1.2.5.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ vars.APP_DIR }}
            # On synchronise le dépôt AVANT de charger deploy.sh, alors que le script le fait
            # aussi lui-même (son reset devient un no-op ici, mais reste indispensable au
            # lancement manuel `./deploy.sh`) : bash lit toujours la version finale du script,
            # dès le premier octet (cf. le bloc { } de deploy.sh).
            git fetch origin
            git reset --hard origin/main
            bash deploy.sh

      - name: Healthcheck (API up)
        run: |
          for i in $(seq 1 12); do
            if curl -sf --max-time 10 "${{ vars.APP_URL }}/api/health"; then
              echo "Health OK on attempt $i"
              exit 0
            fi
            echo "Attempt $i/12 failed, retrying in 10s..."
            sleep 10
          done
          echo "Healthcheck /api/health failed after 120s"
          exit 1
