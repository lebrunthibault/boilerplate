[project]
name = "boilerplate"
version = "0.1.0"
description = "Socle d'application : FastAPI + Postgres + Vue, auth admin, docker, CI, sauvegardes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "logfire[fastapi,asyncpg,httpx]>=4.31.0",
    "argon2-cffi>=23.1",
    "pydantic-ai-slim[anthropic,mistral,openai]>=2.57.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "mypy",
    "import-linter",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["api*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# Réseau interdit dans les tests (--allow-unix-socket : socketpair interne d'asyncio) ;
# les evals payantes (marker eval) sont exclues du run par défaut → make test-evals.
addopts = "--disable-socket --allow-unix-socket -m 'not eval'"
markers = [
    "eval: evals payantes (vrais appels API externes), exclues du run par défaut",
]

[dependency-groups]
dev = [
    "pytest-socket>=0.8.1",
]
